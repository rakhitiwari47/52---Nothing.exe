services:
  # FastAPI Backend Service
  - type: web
    name: healflow-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healflow-postgres
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  # Managed PostgreSQL Instance
  - name: healflow-postgres
    databaseName: healflow
    user: healflow_user
    plan: free
